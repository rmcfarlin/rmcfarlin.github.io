<!-- @dsCard group="Slides" viewport="1280x720" name="Board deck — Title" subtitle="Cover slide" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  .slide{width:1280px;height:720px;background:var(--forest);color:var(--text-on-forest);
    font-family:var(--font-sans);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box;}
  .top{display:flex;align-items:center;gap:14px;}
  .top .name{font-weight:700;font-size:20px;letter-spacing:-0.02em;}
  .top .role{font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,241,234,0.6);}
  .eyebrow{font-family:var(--font-mono);font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);margin-bottom:24px;}
  h1{font-weight:700;font-size:72px;line-height:1.02;letter-spacing:-0.03em;margin:0;max-width:920px;text-wrap:balance;}
  .sub{font-size:22px;line-height:1.5;color:rgba(244,241,234,0.78);max-width:680px;margin:28px 0 0;}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--font-mono);font-size:13px;letter-spacing:0.04em;color:rgba(244,241,234,0.6);}
  .rule{position:absolute;left:80px;right:80px;bottom:150px;height:1px;background:rgba(244,241,234,0.18);}
</style></head>
<body>
<div class="slide">
  <div class="top">
    <img src="../assets/mark-light.svg" width="40" height="40" alt="" />
    <div style="display:flex;flex-direction:column;gap:3px;line-height:1;">
      <span class="name">Robert McFarlin</span>
      <span class="role">Fractional CFO</span>
    </div>
  </div>
  <div>
    <div class="eyebrow">Q3 2025 · Board Review</div>
    <h1>Disciplined growth, with runway to spare.</h1>
    <p class="sub">A read on revenue, margin, and cash — and the three decisions in front of us this quarter.</p>
  </div>
  <div class="rule"></div>
  <div class="foot"><span>Acme Robotics, Inc.</span><span>Confidential — prepared for the Board of Directors</span></div>
</div>
</body></html>
