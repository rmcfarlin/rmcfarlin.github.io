<!-- @dsCard group="Slides" viewport="1280x720" name="Board deck — Closing statement" subtitle="Recommendation / big statement" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  .slide{width:1280px;height:720px;background:var(--surface-muted);color:var(--ink);font-family:var(--font-sans);box-sizing:border-box;padding:80px;display:flex;flex-direction:column;justify-content:center;position:relative;}
  .eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-strong);margin-bottom:28px;}
  blockquote{font-weight:600;font-size:46px;line-height:1.22;letter-spacing:-0.02em;margin:0;max-width:1000px;text-wrap:balance;}
  .accent{color:var(--moss);}
  .ask{margin-top:44px;display:flex;gap:40px;}
  .ask .item{padding-left:20px;border-left:2px solid var(--forest);max-width:300px;}
  .ask .n{font-family:var(--font-mono);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-tertiary);}
  .ask .t{font-size:18px;font-weight:600;margin-top:8px;line-height:1.35;}
  .foot{position:absolute;left:80px;right:80px;bottom:48px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:12px;color:var(--ink-tertiary);}
</style></head>
<body>
<div class="slide">
  <span class="eyebrow">Recommendation</span>
  <blockquote>We have the runway to invest. I recommend we <span class="accent">accelerate hiring in Q4</span> — funded by margin, not new capital.</blockquote>
  <div class="ask">
    <div class="item"><div class="n">Decision 1</div><div class="t">Approve the Q4 operating plan</div></div>
    <div class="item"><div class="n">Decision 2</div><div class="t">Open the senior RevOps hire</div></div>
    <div class="item"><div class="n">Decision 3</div><div class="t">Reaffirm the FY ARR target</div></div>
  </div>
  <div class="foot">
    <span style="display:flex;align-items:center;gap:10px;"><img src="../assets/mark.svg" width="22" height="22" alt="" />Robert McFarlin · Fractional CFO</span>
    <span>04</span>
  </div>
</div>
</body></html>
