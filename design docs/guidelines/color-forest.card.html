<!-- @dsCard group="Colors" viewport="700x190" name="Forest — brand primary" subtitle="Forest green family + tinted wash" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:24px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{height:72px;border-radius:var(--radius-md);border:1px solid var(--line);}
  .n{font-size:12.5px;font-weight:600;color:var(--ink);}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--forest)"></div><span class="n">Forest</span><span class="v">#1A3A2E</span></div>
  <div class="sw"><div class="chip" style="background:var(--forest-strong)"></div><span class="n">Forest strong</span><span class="v">#122A20</span></div>
  <div class="sw"><div class="chip" style="background:var(--moss)"></div><span class="n">Moss</span><span class="v">#2F5D50</span></div>
  <div class="sw"><div class="chip" style="background:var(--sage)"></div><span class="n">Sage</span><span class="v">#8C9A8E</span></div>
  <div class="sw"><div class="chip" style="background:var(--forest-wash)"></div><span class="n">Forest wash</span><span class="v">#ECF1EC</span></div>
</div>
</body></html>
