<!-- @dsCard group="Brand" viewport="700x230" name="Voice — in one breath" subtitle="How Robert McFarlin sounds" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:30px;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-tertiary);margin:0 0 14px;}
  .quote{font-size:25px;line-height:1.32;letter-spacing:-0.01em;font-weight:500;color:var(--ink);max-width:600px;margin:0 0 16px;}
  .pills{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--moss);background:var(--forest-wash);border-radius:var(--radius-pill);padding:5px 11px;}
</style></head>
<body>
  <p class="eyebrow">Brand Voice</p>
  <p class="quote">Precise, never breathless. We state the number, then the implication — and we earn trust by what we leave out.</p>
  <div class="pills"><span class="pill">Senior</span><span class="pill">Discreet</span><span class="pill">Plain-spoken</span><span class="pill">Evidence-led</span></div>
</body></html>
