<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation — shadows" subtitle="Soft, warm-tinted depth" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:30px;}
  .row{display:flex;gap:26px;flex-wrap:wrap;}
  .u{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .box{width:96px;height:64px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="v">xs</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="v">sm</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="v">md</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="v">lg</span></div>
</div>
</body></html>
