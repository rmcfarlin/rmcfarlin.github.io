<!-- @dsCard group="Colors" viewport="700x170" name="Data-viz — categorical series" subtitle="Warm earthy chart palette + brass accent" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:24px;}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:var(--radius-md);}
  .n{font-size:11.5px;font-weight:600;color:var(--ink);}
  .v{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--viz-1)"></div><span class="n">Series 1</span><span class="v">Forest</span></div>
  <div class="sw"><div class="chip" style="background:var(--viz-2)"></div><span class="n">Series 2</span><span class="v">Moss</span></div>
  <div class="sw"><div class="chip" style="background:var(--viz-3)"></div><span class="n">Series 3</span><span class="v">Brass</span></div>
  <div class="sw"><div class="chip" style="background:var(--viz-4)"></div><span class="n">Series 4</span><span class="v">Teal</span></div>
  <div class="sw"><div class="chip" style="background:var(--viz-5)"></div><span class="n">Series 5</span><span class="v">Sage</span></div>
  <div class="sw"><div class="chip" style="background:var(--viz-6)"></div><span class="n">Series 6</span><span class="v">Clay</span></div>
</div>
</body></html>
