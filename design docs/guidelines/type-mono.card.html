<!-- @dsCard group="Type" viewport="700x240" name="Mono, eyebrow & tabular figures" subtitle="IBM Plex Mono — labels & numbers" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:28px;}
  .blk{padding:12px 0;border-bottom:1px solid var(--line);}
  .blk:last-child{border-bottom:none;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-tertiary);margin-bottom:8px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-tertiary);}
  .nums{font-family:var(--font-mono);font-variant-numeric:tabular-nums lining-nums;font-size:22px;font-weight:500;color:var(--ink);display:flex;flex-direction:column;gap:2px;}
</style></head>
<body>
  <div class="blk"><div class="meta">Eyebrow · 12 · tracked uppercase</div><span class="eyebrow">Engagement Summary</span></div>
  <div class="blk"><div class="meta">Tabular figures — columns align</div>
    <div class="nums"><span>$ 4,820,000</span><span>$ 1,118,400</span><span>$&nbsp;&nbsp;&nbsp;310,250</span></div>
  </div>
</body></html>
