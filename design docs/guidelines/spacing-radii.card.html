<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Restrained, premium" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:24px;}
  .row{display:flex;gap:18px;flex-wrap:wrap;}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:72px;height:60px;background:var(--surface);border:1.5px solid var(--forest);}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="u"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="v">xs · 4</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="v">sm · 6</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><span class="v">md · 8</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="v">lg · 12</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="v">xl · 16</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="v">pill</span></div>
</div>
</body></html>
