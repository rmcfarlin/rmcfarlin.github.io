<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .bar{background:var(--forest);border-radius:var(--radius-xs);width:22px;}
  .v{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="u"><div class="bar" style="height:4px"></div><span class="v">1·4</span></div>
  <div class="u"><div class="bar" style="height:8px"></div><span class="v">2·8</span></div>
  <div class="u"><div class="bar" style="height:12px"></div><span class="v">3·12</span></div>
  <div class="u"><div class="bar" style="height:16px"></div><span class="v">4·16</span></div>
  <div class="u"><div class="bar" style="height:24px"></div><span class="v">6·24</span></div>
  <div class="u"><div class="bar" style="height:32px"></div><span class="v">7·32</span></div>
  <div class="u"><div class="bar" style="height:48px"></div><span class="v">9·48</span></div>
  <div class="u"><div class="bar" style="height:64px"></div><span class="v">10·64</span></div>
  <div class="u"><div class="bar" style="height:96px"></div><span class="v">12·96</span></div>
</div>
</body></html>
