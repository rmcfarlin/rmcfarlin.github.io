<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>McFarlin — Financial Dashboard</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  #root { height: 100vh; }
  .shell { display: flex; height: 100%; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="DashShell.jsx"></script>
<script type="text/babel" src="DashContent.jsx"></script>
<script type="text/babel" data-presets="react">
  function App() {
    const [active, setActive] = React.useState('Overview');
    const [period, setPeriod] = React.useState('Q3 2025');
    React.useEffect(() => {
      if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.75, width: 18, height: 18 } });
    });
    return (
      <div className="shell">
        <DashSidebar active={active} onSelect={setActive} />
        <div className="main">
          <DashTopbar period={period} onPeriod={setPeriod} />
          <DashContent period={period} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
